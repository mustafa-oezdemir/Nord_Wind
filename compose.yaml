name: ${COMPOSE_PROJECT_NAME:-nordwinds}

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nordwinds}
      POSTGRES_USER: ${POSTGRES_USER:-nordwinds_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:${HOST_MAILHOG_PORT:-8025}:8025"
    expose:
      - "1025"
    networks:
      - public
    security_opt:
      - no-new-privileges:true

  migrate:
    image: nordwinds-api:local
    build:
      context: .
      target: api
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment: &database-environment
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-nordwinds}
      POSTGRES_USER: ${POSTGRES_USER:-nordwinds_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_SSLMODE: disable
      NORDWINDS_DB_RUNTIME_PASSWORD: ${NORDWINDS_DB_RUNTIME_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    image: nordwinds-api:local
    build:
      context: .
      target: api
    environment:
      <<: *database-environment
      POSTGRES_USER: ${NORDWINDS_DB_RUNTIME_USER:-${POSTGRES_USER:-nordwinds_app}}
      POSTGRES_PASSWORD: ${NORDWINDS_DB_RUNTIME_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}}
      NORDWINDS_DB_RUNTIME_PASSWORD: ""
      APP_NAME: ${APP_NAME:-NordWinds}
      APP_ENV: ${APP_ENV:-development}
      NORDWINDS_DEMO_CHECKOUT_ENABLED: ${NORDWINDS_DEMO_CHECKOUT_ENABLED:-false}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:8080}
      NORDWINDS_TRUST_PROXY_CLIENT_IP: "true"
      NORDWINDS_MOCK_WEBHOOK_SECRET: ${NORDWINDS_MOCK_WEBHOOK_SECRET:-}
      API_HTTP_PORT: ${API_HTTP_PORT:-8080}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${API_HTTP_PORT:-8080}/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "${API_HTTP_PORT:-8080}"
    networks:
      - private
      - public
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

  edge:
    image: nordwinds-edge:local
    build:
      context: .
      target: edge
    depends_on:
      api:
        condition: service_healthy
      ssr:
        condition: service_healthy
    environment:
      API_HTTP_PORT: ${API_HTTP_PORT:-8080}
      SSR_HTTP_PORT: 4000
    ports:
      - "127.0.0.1:${HOST_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777

  ssr:
    image: nordwinds-ssr:local
    build:
      context: .
      target: ssr
    environment:
      PORT: 4000
      NORDWINDS_INTERNAL_API_ORIGIN: http://api:${API_HTTP_PORT:-8080}
      NORDWINDS_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/konto').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    expose:
      - "4000"
    networks:
      - public
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777

networks:
  private:
    internal: true
  public: {}

volumes:
  db-data: {}
