# Prometheus für NordWinds (ADR-012). Zugangsdaten und Zertifikate erzeugt
# monitoring-init unter /run/monitoring; diese Datei enthält keine Geheimnisse.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    shop: nordwinds

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus selbst – über HTTPS und mit Anmeldung wie jeder andere Client.
  - job_name: prometheus
    scheme: https
    basic_auth:
      username_file: /run/monitoring/self_scrape_user
      password_file: /run/monitoring/self_scrape_password
    tls_config:
      ca_file: /run/monitoring/ca.crt
    static_configs:
      - targets: ["localhost:9090"]

  # Go-API: Verkehr je Route, Fehler, Laufzeit, Datenbankpool und Geschäftskennzahlen.
  # /internal/metrics ist nur im Compose-Netz erreichbar; Caddy antwortet außen mit 404.
  - job_name: nordwinds-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/monitoring/metrics_token
    static_configs:
      - targets: ["api:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Sicht eines Kunden: Seiten über Caddy und das Angular-SSR.
  - job_name: probe-storefront
    metrics_path: /probe
    params:
      module: [http_storefront]
    static_configs:
      - targets:
          - http://edge:8080/
          - http://edge:8080/produkte
    relabel_configs: &probe-relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Katalog-API über Caddy (prüft API und Datenbank gemeinsam).
  - job_name: probe-api
    metrics_path: /probe
    params:
      module: [http_api]
    static_configs:
      - targets:
          - http://edge:8080/api/v1/products
    relabel_configs: *probe-relabel

  # Laufzeit des eigenen TLS-Zertifikats (nur TLS-Handshake, keine Anmeldung nötig).
  - job_name: probe-prometheus-tls
    metrics_path: /probe
    params:
      module: [tls_prometheus]
    static_configs:
      - targets: ["prometheus:9090"]
    relabel_configs: *probe-relabel
