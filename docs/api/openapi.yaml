openapi: 3.0.3
info:
  title: NordWinds API
  version: 1.0.0
  description: >-
    Öffentliche, lesende Katalog-Endpunkte sowie geschützte Authentifizierungs-,
    Verwaltungs- und Warenkorb-Endpunkte unter `/api/v1`. Die rohe Query-Zeichenfolge öffentlicher
    Kataloglisten ist auf 512 Bytes begrenzt; unbekannte oder mehrfach übergebene
    Parameter werden dort abgewiesen.
paths:
  /api/v1/admin/categories:
    get:
      summary: Alle Kategorien für die Verwaltung auflisten
      operationId: adminListCategories
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminCategoryList' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
    post:
      summary: Kategorie anlegen
      operationId: adminCreateCategory
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryWrite' }
      responses:
        '201': { $ref: '#/components/responses/AdminCategory' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/categories/{id}:
    parameters: [{ $ref: '#/components/parameters/AdminID' }]
    get:
      summary: Kategorie lesen
      operationId: adminGetCategory
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminCategory' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    put:
      summary: Kategorie vollständig ersetzen
      operationId: adminUpdateCategory
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryWrite' }
      responses:
        '200': { $ref: '#/components/responses/AdminCategory' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
    delete:
      summary: Unbenutzte Kategorie löschen
      operationId: adminDeleteCategory
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Kategorie gelöscht und Audit-Ereignis geschrieben. }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/products:
    get:
      summary: Alle Produkte einschließlich Entwürfen auflisten
      operationId: adminListProducts
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminProductList' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
    post:
      summary: Produkt anlegen
      operationId: adminCreateProduct
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWrite' }
      responses:
        '201': { $ref: '#/components/responses/AdminProduct' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/products/{id}:
    parameters: [{ $ref: '#/components/parameters/AdminID' }]
    get:
      summary: Produkt lesen
      operationId: adminGetProduct
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    put:
      summary: Produkt vollständig ersetzen und Status setzen
      operationId: adminUpdateProduct
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductWrite' }
      responses:
        '200': { $ref: '#/components/responses/AdminProduct' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
    delete:
      summary: Unbenutztes Produkt löschen
      operationId: adminDeleteProduct
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Produkt gelöscht und Audit-Ereignis geschrieben. }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/products/{id}/categories:
    parameters: [{ $ref: '#/components/parameters/AdminID' }]
    get:
      summary: Zugeordnete Kategorien lesen
      operationId: adminListProductCategories
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminCategoryList' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    post:
      summary: Kategorie einem Produkt zuordnen
      operationId: adminAttachCategory
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id]
              properties:
                category_id: { type: string, format: uuid }
      responses:
        '204': { description: Kategorie zugeordnet und Audit-Ereignis geschrieben. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/products/{id}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/AdminID'
      - name: categoryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Kategoriezuordnung entfernen
      operationId: adminDetachCategory
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Zuordnung entfernt und Audit-Ereignis geschrieben. }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/admin/products/{id}/variants:
    parameters: [{ $ref: '#/components/parameters/AdminID' }]
    get:
      summary: Varianten eines Produkts lesen
      operationId: adminListVariants
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminVariantList' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    post:
      summary: Variante anlegen
      operationId: adminCreateVariant
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantWrite' }
      responses:
        '201': { $ref: '#/components/responses/AdminVariant' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/variants/{id}:
    parameters: [{ $ref: '#/components/parameters/AdminID' }]
    get:
      summary: Variante lesen
      operationId: adminGetVariant
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminVariant' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    put:
      summary: Variante vollständig ersetzen, Preis und Bestand aktualisieren
      operationId: adminUpdateVariant
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantWrite' }
      responses:
        '200': { $ref: '#/components/responses/AdminVariant' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
    delete:
      summary: Unbenutzte Variante löschen
      operationId: adminDeleteVariant
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Variante gelöscht und Audit-Ereignis geschrieben. }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/audit:
    get:
      summary: Die letzten 100 Adminänderungen lesen
      operationId: adminListAudit
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdminAuditList' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/admin/products/{id}/images:
    parameters: [{ $ref: '#/components/parameters/AdminID' }]
    get:
      summary: Bilder eines Produkts in der Verwaltung lesen
      operationId: adminListImages
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ProductImageList' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
    post:
      summary: Bild hochladen und als neues JPEG speichern
      operationId: adminUploadImage
      description: JPEG/PNG bis 3 MiB und 2000 × 2000 Pixel; höchstens sechs Bilder pro Produkt. Originalname und Metadaten werden verworfen.
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, alt]
              properties:
                image: { type: string, format: binary }
                alt: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201': { $ref: '#/components/responses/ProductImage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
  /api/v1/admin/images/{id}:
    delete:
      summary: Produktbild entfernen
      operationId: adminDeleteImage
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AdminID'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Bild gelöscht und Audit-Ereignis geschrieben. }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/media/products/{id}:
    get:
      summary: Bereinigtes Bild eines veröffentlichten oder archivierten Produkts abrufen
      operationId: getProductImage
      parameters: [{ $ref: '#/components/parameters/AdminID' }]
      responses:
        '200':
          description: 'Neu kodiertes JPEG; X-Content-Type-Options: nosniff.'
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/ProductNotFound' }
  /api/v1/cart:
    get:
      summary: Warenkorb des angemeldeten Kunden mit aktuellen Preisen und Bestand lesen
      operationId: getCart
      security: [{ SessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/CartSnapshot' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/cart/items:
    post:
      summary: Variante hinzufügen; vorhandene Menge wird atomar erhöht
      operationId: addCartItem
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id, quantity]
              additionalProperties: false
              properties:
                variant_id: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200': { $ref: '#/components/responses/CartSnapshot' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/cart/items/{variantId}:
    parameters:
      - name: variantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Menge einer vorhandenen Variante vollständig setzen
      operationId: setCartItemQuantity
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '200': { $ref: '#/components/responses/CartSnapshot' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
    delete:
      summary: Variante aus dem Warenkorb entfernen
      operationId: removeCartItem
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '204': { description: Position entfernt. }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/cart/discount:
    put:
      summary: Rabattcode im Warenkorb hinterlegen
      description: >-
        Ersetzt einen vorhandenen Code. Unbekannte, deaktivierte und abgelaufene Codes ergeben
        einheitlich 404. Nach 10 Fehlversuchen je Kunde in 15 Minuten folgt 429.
      operationId: applyCartDiscount
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, maxLength: 64, description: Groß-/Kleinschreibung und Leerraum am Rand werden ignoriert. }
      responses:
        '200': { $ref: '#/components/responses/CartSnapshot' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '429': { $ref: '#/components/responses/AuthProblem' }
    delete:
      summary: Rabattcode aus dem Warenkorb entfernen
      operationId: removeCartDiscount
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200': { $ref: '#/components/responses/CartSnapshot' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/orders:
    post:
      summary: Bestellung aus dem Warenkorb anlegen (Kasse)
      description: >-
        Rechnet den Warenkorb serverseitig neu (ADR-007) und legt Bestellung, Positionen und den
        ersten Statuseintrag in einer Transaktion an; danach ist der Warenkorb leer (ADR-008).
        Weicht die neu berechnete Gesamtsumme von `expected_total_cents` ab oder ist eine Position
        nicht mehr lieferbar, entsteht keine Bestellung (409 `CART_CHANGED` mit aktuellem Warenkorb).
        Dieselbe Anfrage mit demselben `Idempotency-Key` liefert die vorhandene Bestellung (200);
        derselbe Schlüssel mit anderer Adresse oder Summe ergibt 422. Der Bestand wird innerhalb
        derselben Transaktion für 15 Minuten reserviert; konkurrierende Bestellungen können das
        letzte Stück nur einmal erhalten.
      operationId: createOrder
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Bestellung angelegt.
          headers:
            Location: { schema: { type: string }, description: '`/api/v1/orders/{orderNumber}`' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Wiederholung mit demselben Idempotency-Key; die vorhandene Bestellung.
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '409':
          description: '`CART_EMPTY` oder `CART_CHANGED` (mit `reason` und aktuellem `cart`); keine Bestellung angelegt.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`VALIDATION_FAILED` mit Feldfehlern in `errors` oder `IDEMPOTENCY_KEY_REUSED`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/orders/{orderNumber}:
    get:
      summary: Eigene Bestellung lesen
      description: Fremde und unbekannte Bestellnummern ergeben einheitlich 404.
      operationId: getOrder
      security: [{ SessionCookie: [] }]
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string, pattern: '^NW-[0-9]{4}-[0-9]{6,12}$', example: NW-2026-100001 }
      responses:
        '200':
          description: Bestellung mit unveränderlichem Snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/orders/{orderNumber}/cancel:
    post:
      summary: Eigene offene Bestellung stornieren und Reservierung freigeben
      operationId: cancelOrder
      security: [{ SessionCookie: [] }]
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string, pattern: '^NW-[0-9]{4}-[0-9]{6,12}$' }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '200':
          description: Stornierte Bestellung; wiederholter Abbruch liefert denselben Zustand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/discount-codes:
    get:
      summary: Rabattcodes auflisten
      operationId: listDiscountCodes
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Alle Rabattcodes, neueste zuerst.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DiscountCode' } }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
    post:
      summary: Rabattcode anlegen
      description: Der Code wird großgeschrieben gespeichert und ist danach unveränderlich; jede Änderung erzeugt ein Audit-Ereignis.
      operationId: createDiscountCode
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, percent_bp]
              properties:
                code: { type: string, description: '3–32 Zeichen A–Z, 0–9 und Bindestrich; Kleinbuchstaben werden umgewandelt.' }
                percent_bp: { type: integer, minimum: 1, maximum: 10000 }
                is_active: { type: boolean, default: true }
                valid_from: { type: string, format: date-time, nullable: true }
                valid_until: { type: string, format: date-time, nullable: true, description: Muss nach `valid_from` liegen. }
      responses:
        '201':
          description: Angelegter Code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountCode' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/admin/discount-codes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Prozentsatz, Aktivierung und Gültigkeit eines Codes ändern
      operationId: updateDiscountCode
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [percent_bp]
              properties:
                percent_bp: { type: integer, minimum: 1, maximum: 10000 }
                is_active: { type: boolean, default: true }
                valid_from: { type: string, format: date-time, nullable: true }
                valid_until: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Geänderter Code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscountCode' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/auth/register:
    post:
      summary: Kundenkonto registrieren
      operationId: registerCustomer
      description: Erstellt ausschließlich eine Kundenrolle; eine Adminrolle wird nicht über diese API vergeben.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Konto erstellt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnvelope'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '409': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/auth/login:
    post:
      summary: Anmelden und neue Session ausstellen
      operationId: loginCustomer
      description: Gleiche Fehlerantwort für unbekannte E-Mail und falsches Passwort; ersetzt eine vorhandene Session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Session-Cookie und CSRF-Token für geschützte Schreibzugriffe.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '429': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/auth/session:
    get:
      summary: Aktuelle Session und CSRF-Token lesen
      operationId: getAuthSession
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Aktuelle Session; nicht zwischenspeichern.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/auth/logout:
    post:
      summary: Session serverseitig widerrufen
      operationId: logoutCustomer
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session widerrufen und Cookie gelöscht. }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/customer/me:
    get:
      summary: Kundenprofil lesen
      operationId: getCustomerProfile
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Aktueller Kunde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerEnvelope'
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/mock-payments:
    post:
      summary: Simulierte Zahlung für eigene Bestellung initiieren
      description: Nur bei `APP_ENV=development`; keine echte Zahlung und keine Annahme von Kartendaten.
      operationId: initiateMockPayment
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, method]
              additionalProperties: false
              properties:
                order_id: { type: string, format: uuid }
                method: { $ref: '#/components/schemas/MockPaymentMethod' }
      responses:
        '200':
          description: Zahlung neu erstellt oder idempotent wiedergefunden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockPayment' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/mock-payments/methods:
    get:
      summary: Verfügbare simulierte Zahlungsarten lesen
      description: Nur bei `APP_ENV=development`; sonst 404.
      operationId: listMockPaymentMethods
      responses:
        '200':
          description: Simulationsmodus und verfügbare Methoden.
          content:
            application/json:
              schema:
                type: object
                required: [mode, methods]
                properties:
                  mode: { type: string, enum: [mock] }
                  methods:
                    type: array
                    items: { $ref: '#/components/schemas/MockPaymentMethod' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/mock-payments/by-order/{orderId}:
    get:
      summary: Simulierte Zahlung einer eigenen Bestellung lesen
      description: Nur bei `APP_ENV=development`; fremde und unbekannte Zahlungen ergeben 404.
      operationId: getMockPaymentByOrder
      security: [{ SessionCookie: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Zahlung und aktueller Zustand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockPayment' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/mock-payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, pattern: '^pay_[0-9a-f]{32}$' }
    get:
      summary: Eigene simulierte Zahlung lesen
      description: Nur bei `APP_ENV=development`.
      operationId: getMockPayment
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Zahlung und aktueller Zustand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockPayment' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
  /api/v1/mock-payments/{paymentId}/simulate:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, pattern: '^pay_[0-9a-f]{32}$' }
    post:
      summary: Signiertes Mock-Ereignis für eigene Zahlung auslösen
      description: Nur bei `APP_ENV=development` und mit Kunden-Session und CSRF-Token.
      operationId: simulateMockPayment
      security: [{ SessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              additionalProperties: false
              properties:
                outcome: { type: string, enum: [succeeded, failed, refunded] }
      responses:
        '200':
          description: Ereignis verarbeitet.
          content:
            application/json:
              schema:
                type: object
                required: [event_id, payment]
                properties:
                  event_id: { type: string, pattern: '^evt_[0-9a-f]{32}$' }
                  payment: { $ref: '#/components/schemas/MockPayment' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
        '403': { $ref: '#/components/responses/AuthProblem' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
  /api/v1/mock-payments/webhook:
    post:
      summary: Signiertes Mock-Webhook-Ereignis empfangen
      description: >-
        Nur bei `APP_ENV=development`. Der Header `X-Nordwinds-Mock-Signature` enthält
        `t=<Unix-Sekunden>,v1=<Hex-HMAC>` über `timestamp + "." + raw_body`.
      operationId: receiveMockPaymentWebhook
      parameters:
        - name: X-Nordwinds-Mock-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MockPaymentEvent' }
      responses:
        '200': { description: Ereignis verarbeitet oder idempotent bestätigt. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthProblem' }
  /api/v1/products:
    get:
      summary: Veröffentlichte Produkte auflisten
      description: >-
        Nur veröffentlichte Produkte mit mindestens einer aktiven Variante werden geliefert.
        `price_cents` ist der niedrigste Preis einer aktiven Variante; `available` ist wahr,
        wenn mindestens eine aktive Variante Bestand hat. Ein Kategoriefilter umfasst die
        aktive Kategorie und ihre aktiven Unterkategorien.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/ProductCategory'
        - $ref: '#/components/parameters/Query'
        - name: sort
          in: query
          description: Feste Sortieroption; andere Werte werden abgewiesen.
          schema:
            type: string
            enum: [newest, name_asc, price_asc, price_desc]
            default: newest
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Produktseite; `data` ist auch bei leerem Ergebnis ein Array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/products/{slug}:
    get:
      summary: Ein öffentliches Produkt mit Varianten abrufen
      description: >-
        Liefert veröffentlichte und archivierte Produkte; Entwürfe ergeben 404. Der Slug wird
        ohne Beachtung der Großschreibung verglichen, die Antwort enthält den gespeicherten Slug.
        Varianten sind nur aktive Varianten, sortiert nach Preis und Bezeichnung. Archivierte
        Produkte liefern keine Varianten. Exakte Lagermengen werden nicht veröffentlicht,
        sondern als `stock_status` (knapp ab höchstens 5 Stück). Query-Parameter sind nicht
        erlaubt.
      operationId: getProduct
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        '200':
          description: Produkt mit Verkaufsstatus, aktiven Kategorien und Varianten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/categories:
    get:
      summary: Aktive Kategorien auflisten
      description: >-
        Ohne `category` werden alle aktiven Kategorien geliefert. Mit `category` werden
        nur die direkten aktiven Unterkategorien des angegebenen Slugs geliefert.
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/ParentCategory'
        - $ref: '#/components/parameters/Query'
        - name: sort
          in: query
          description: Feste Sortieroption; andere Werte werden abgewiesen.
          schema:
            type: string
            enum: [sort_order, name_asc, name_desc]
            default: sort_order
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Kategorieseite; `data` ist auch bei leerem Ergebnis ein Array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nordwinds_session
  parameters:
    AdminID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Vom Client je Bestellversuch erzeugt (z. B. UUID) und bei Wiederholungen unverändert gesendet.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    ProductCategory:
      name: category
      in: query
      description: Aktiver Kategorie-Slug; umfasst aktive Nachfahren.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    ParentCategory:
      name: category
      in: query
      description: Aktiver Kategorie-Slug; liefert direkte aktive Kinder.
      schema:
        type: string
        minLength: 1
        maxLength: 120
    Query:
      name: q
      in: query
      description: >-
        Teilwortsuche ohne Beachtung der Großschreibung. Leer oder nur Leerzeichen bedeutet
        keinen Suchfilter. Prozentzeichen und Unterstrich werden wörtlich behandelt.
        Produkte durchsuchen Name, Beschreibung und aktive Varianten-SKU;
        Kategorien durchsuchen Name und Beschreibung.
      schema:
        type: string
        maxLength: 100
    Page:
      name: page
      in: query
      description: Einsbasierte Seitennummer.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    Limit:
      name: limit
      in: query
      description: Maximale Einträge je Seite.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    AdminCategory:
      description: Kategorie.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminCategory' }
    AdminCategoryList:
      description: Kategorien einschließlich inaktiver Einträge.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/AdminCategory' } }
    AdminProduct:
      description: Produkt.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProduct' }
    AdminProductList:
      description: Produkte einschließlich Entwürfen und archivierter Einträge.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
    AdminVariant:
      description: Variante.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminVariant' }
    AdminVariantList:
      description: Varianten einschließlich inaktiver Einträge.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/AdminVariant' } }
    AdminAuditList:
      description: Letzte 100 Änderungen.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/AdminAuditEvent' } }
    ProductImage:
      description: Bereinigtes Produktbild.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductImage' }
    ProductImageList:
      description: Bilder in Uploadreihenfolge.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }
    CartSnapshot:
      description: Aktueller Warenkorb mit serverseitiger Preisaufstellung; berechnet werden nur lieferbare Positionen.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CartSnapshot' }
    AdminConflict:
      description: Unique- oder Fremdschlüsselkonflikt; keine Änderung oder Audit-Eintrag geschrieben.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AdminNotFound:
      description: Datensatz nicht gefunden.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AuthProblem:
      description: Authentifizierung, Berechtigung, CSRF oder Rate-Limit fehlgeschlagen.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: Ungültiger, doppelter oder nicht unterstützter Abfrageparameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BodyTooLarge:
      description: Multipart-Anfrage oder Bilddatei überschreitet das Größenlimit.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CategoryNotFound:
      description: Der angegebene aktive Kategorie-Slug existiert nicht.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProductNotFound:
      description: Kein veröffentlichtes oder archiviertes Produkt mit diesem Slug.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Interner Fehler ohne technische Details im HTTP-Body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MockPaymentMethod:
      type: string
      enum: [debit_card, klarna, paypal, bank_transfer]
      description: Ausschließlich simulierte Zahlungsart.
    MockPayment:
      type: object
      required: [id, order_id, method, state, amount_cents, currency]
      properties:
        id: { type: string, pattern: '^pay_[0-9a-f]{32}$' }
        order_id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/MockPaymentMethod' }
        state: { type: string, enum: [pending, succeeded, failed, refunded] }
        amount_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [EUR] }
    MockPaymentEvent:
      type: object
      required: [id, payment_id, order_id, method, outcome, amount_cents, currency]
      additionalProperties: false
      properties:
        id: { type: string, pattern: '^evt_[0-9a-f]{32}$' }
        payment_id: { type: string, pattern: '^pay_[0-9a-f]{32}$' }
        order_id: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/MockPaymentMethod' }
        outcome: { type: string, enum: [succeeded, failed, refunded] }
        amount_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [EUR] }
    CategoryWrite:
      type: object
      required: [name, slug, status, sort_order]
      properties:
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        status: { type: string, enum: [active, inactive] }
        sort_order: { type: integer, format: int32, minimum: 0 }
    ProductWrite:
      type: object
      required: [name, slug, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120 }
        description: { type: string, maxLength: 10000 }
        status: { type: string, enum: [draft, published, archived] }
        tax_class:
          type: string
          enum: [standard, reduced]
          default: standard
          description: Umsatzsteuer aller Varianten; `standard` = 19 %, `reduced` = 7 % (ADR-007). Fehlt der Wert, gilt `standard`.
    VariantWrite:
      type: object
      required: [sku, label, price_cents, stock_quantity, is_active]
      properties:
        sku: { type: string, minLength: 1, maxLength: 120 }
        label: { type: string, minLength: 1, maxLength: 200 }
        price_cents: { type: integer, format: int64, minimum: 0 }
        stock_quantity: { type: integer, format: int32, minimum: 0 }
        is_active: { type: boolean }
    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/CategoryWrite'
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/ProductWrite'
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AdminVariant:
      allOf:
        - $ref: '#/components/schemas/VariantWrite'
        - type: object
          required: [id, product_id, currency, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            product_id: { type: string, format: uuid }
            currency: { type: string, enum: [EUR] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AdminAuditEvent:
      type: object
      required: [id, actor_customer_id, entity_type, entity_id, related_id, action, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor_customer_id: { type: string, format: uuid }
        entity_type: { type: string, enum: [category, product, variant, product_category, image] }
        entity_id: { type: string, format: uuid }
        related_id: { type: string, format: uuid, nullable: true }
        action: { type: string, enum: [create, update, delete, attach, detach] }
        created_at: { type: string, format: date-time }
    CartItem:
      type: object
      required: [variant_id, product_id, product_slug, product_name, sku, label, quantity, unit_price_cents, line_total_cents, currency, available, unavailable_reason, tax_class, tax_rate_bp]
      properties:
        variant_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_slug: { type: string }
        product_name: { type: string }
        sku: { type: string }
        label: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unit_price_cents: { type: integer, format: int64, minimum: 0 }
        line_total_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [EUR] }
        available: { type: boolean }
        unavailable_reason: { type: string, enum: ['', product_unavailable, insufficient_stock] }
        tax_class: { type: string, enum: [standard, reduced] }
        tax_rate_bp: { type: integer, enum: [1900, 700], description: Steuersatz in Basispunkten (1900 = 19 %). }
    CartSnapshot:
      type: object
      required: [items, subtotal_cents, currency, discount, pricing]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CartItem' } }
        subtotal_cents: { type: integer, format: int64, minimum: 0, description: Warenwert lieferbarer Positionen; gleich `pricing.goods_cents`. }
        currency: { type: string, enum: [EUR] }
        discount:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/CartDiscount' }]
        pricing: { $ref: '#/components/schemas/CartPricing' }
    CartDiscount:
      type: object
      required: [code, percent_bp, applied]
      properties:
        code: { type: string }
        percent_bp: { type: integer, minimum: 1, maximum: 10000 }
        applied: { type: boolean, description: false, wenn der hinterlegte Code deaktiviert oder abgelaufen ist; er wird dann nicht angerechnet. }
    CartPricing:
      type: object
      description: >-
        Serverseitige Preisaufstellung nach ADR-007. Alle Beträge sind Bruttobeträge in Cent.
        Rabatt = Warenwert × Prozentsatz (kaufmännisch gerundet), Versand 4,90 € unter 50,00 €
        rabattiertem Warenwert, Umsatzsteuer je Satz aus der Bruttosumme herausgerechnet.
        Es gilt `total_cents = goods_cents − discount_cents + shipping_cents = Σ taxes.gross_cents`.
      required: [goods_cents, discount_cents, shipping_cents, total_cents, missing_for_free_shipping_cents, shipping_flat_cents, free_shipping_from_cents, currency, taxes]
      properties:
        goods_cents: { type: integer, format: int64, minimum: 0 }
        discount_cents: { type: integer, format: int64, minimum: 0 }
        shipping_cents: { type: integer, format: int64, minimum: 0 }
        total_cents: { type: integer, format: int64, minimum: 0 }
        missing_for_free_shipping_cents: { type: integer, format: int64, minimum: 0 }
        shipping_flat_cents: { type: integer, format: int64, minimum: 0 }
        free_shipping_from_cents: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [EUR] }
        taxes:
          type: array
          description: Je Steuersatz eine Zeile, höchster Satz zuerst; leer bei leerem Warenkorb.
          items: { $ref: '#/components/schemas/CartTaxLine' }
    CartTaxLine:
      type: object
      required: [tax_class, rate_bp, gross_cents, net_cents, vat_cents]
      properties:
        tax_class: { type: string, enum: [standard, reduced] }
        rate_bp: { type: integer, enum: [1900, 700] }
        gross_cents: { type: integer, format: int64, minimum: 0 }
        net_cents: { type: integer, format: int64, minimum: 0 }
        vat_cents: { type: integer, format: int64, minimum: 0 }
    DiscountCode:
      type: object
      required: [id, code, percent_bp, is_active, valid_from, valid_until, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{2,31}$' }
        percent_bp: { type: integer, minimum: 1, maximum: 10000 }
        is_active: { type: boolean }
        valid_from: { type: string, format: date-time, nullable: true }
        valid_until: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
    CustomerAccount:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, admin] }
    CustomerEnvelope:
      type: object
      required: [customer]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerAccount'
    AuthSession:
      type: object
      required: [customer, csrf_token, expires_at]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerAccount'
        csrf_token:
          type: string
          description: Nur in JSON-Antworten an denselben Origin; niemals in URL oder Log.
        expires_at: { type: string, format: date-time }
    Pagination:
      type: object
      required: [page, limit, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
          description: Anzahl aller Treffer vor LIMIT/OFFSET.
        total_pages:
          type: integer
          format: int64
          minimum: 0
    Product:
      type: object
      required: [id, slug, name, description, price_cents, currency, available, variant_count, image_url]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [EUR]
        available:
          type: boolean
        variant_count:
          type: integer
          format: int64
          minimum: 1
        image_url:
          type: string
          description: Erstes Produktbild oder leerer String für das Platzhalter-Motiv.
    Category:
      type: object
      required: [id, parent_id, slug, name, description, sort_order]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        sort_order:
          type: integer
          format: int32
          minimum: 0
    ProductPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CategoryPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ProductDetail:
      type: object
      required: [id, slug, name, description, sale_status, tax_class, tax_rate_bp, categories, variants, images]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        sale_status:
          type: string
          enum: [available, sold_out, unavailable, discontinued]
          description: >-
            `available`: mindestens eine Variante hat Bestand; `sold_out`: aktive Varianten
            ohne Bestand; `unavailable`: veröffentlicht, aber ohne aktive Variante;
            `discontinued`: archiviert.
        tax_class:
          type: string
          enum: [standard, reduced]
        tax_rate_bp:
          type: integer
          enum: [1900, 700]
          description: Alle Variantenpreise sind Bruttopreise inklusive dieses Steuersatzes.
        categories:
          type: array
          description: Aktive Kategorien in Pflegereihenfolge.
          items:
            $ref: '#/components/schemas/CategoryRef'
        variants:
          type: array
          description: Aktive Varianten; auch ohne Einträge ein Array.
          items:
            $ref: '#/components/schemas/VariantOffer'
        images:
          type: array
          description: Bilder in Uploadreihenfolge; auch ohne Einträge ein Array.
          items:
            $ref: '#/components/schemas/ProductImage'
    ProductImage:
      type: object
      required: [id, src, alt, width, height]
      properties:
        id: { type: string, format: uuid }
        src: { type: string, pattern: '^/api/v1/media/products/[0-9a-f-]+$' }
        alt: { type: string, minLength: 1, maxLength: 200 }
        width: { type: integer, minimum: 1, maximum: 2000 }
        height: { type: integer, minimum: 1, maximum: 2000 }
    CategoryRef:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    VariantOffer:
      type: object
      required: [id, sku, label, price_cents, currency, stock_status]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        label:
          type: string
        price_cents:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          enum: [EUR]
        stock_status:
          type: string
          enum: [in_stock, low_stock, out_of_stock]
    OrderAddress:
      type: object
      description: Liefer- und Rechnungsadresse in Deutschland. Leerraum am Rand wird entfernt.
      required: [first_name, last_name, street, house_number, postal_code, city, country]
      additionalProperties: false
      properties:
        first_name: { type: string, minLength: 1, maxLength: 100 }
        last_name: { type: string, minLength: 1, maxLength: 100 }
        company: { type: string, maxLength: 100 }
        street: { type: string, minLength: 2, maxLength: 100 }
        house_number: { type: string, example: 17a, pattern: '^[0-9]{1,4} ?[A-Za-z]?( ?[-/] ?[0-9]{1,4} ?[A-Za-z]?)?$' }
        address_extra: { type: string, maxLength: 100 }
        postal_code: { type: string, pattern: '^(0[1-9]|[1-9][0-9])[0-9]{3}$' }
        city: { type: string, minLength: 2, maxLength: 100 }
        country: { type: string, enum: [DE] }
    OrderCreate:
      type: object
      required: [address, expected_total_cents]
      additionalProperties: false
      properties:
        address: { $ref: '#/components/schemas/OrderAddress' }
        expected_total_cents:
          type: integer
          format: int64
          minimum: 0
          description: Gesamtsumme, die dem Kunden vor „Zahlungspflichtig bestellen“ angezeigt wurde.
    OrderItem:
      type: object
      required: [position, variant_id, product_name, variant_label, sku, quantity, unit_price_cents, line_total_cents, tax_class, tax_rate_bp]
      properties:
        position: { type: integer, minimum: 1 }
        variant_id: { type: string, format: uuid }
        product_name: { type: string }
        variant_label: { type: string }
        sku: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unit_price_cents: { type: integer, format: int64, description: Bruttostückpreis zum Bestellzeitpunkt. }
        line_total_cents: { type: integer, format: int64 }
        tax_class: { type: string, enum: [standard, reduced] }
        tax_rate_bp: { type: integer, enum: [1900, 700] }
    Order:
      type: object
      required: [id, order_number, status, customer_email, address, items, pricing, discount, created_at]
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string, example: NW-2026-100001 }
        status:
          type: string
          enum: [CREATED, PAYMENT_PENDING, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, PAYMENT_FAILED]
          description: Neue Bestellungen beginnen mit `CREATED`; erlaubte Wechsel stehen in ADR-008.
        customer_email: { type: string, format: email }
        address: { $ref: '#/components/schemas/OrderAddress' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        pricing:
          type: object
          required: [goods_cents, discount_cents, shipping_cents, total_cents, currency, taxes]
          properties:
            goods_cents: { type: integer, format: int64 }
            discount_cents: { type: integer, format: int64 }
            shipping_cents: { type: integer, format: int64 }
            total_cents: { type: integer, format: int64 }
            currency: { type: string, enum: [EUR] }
            taxes:
              type: array
              items: { $ref: '#/components/schemas/CartTaxLine' }
        discount:
          type: object
          nullable: true
          required: [code, percent_bp]
          properties:
            code: { type: string }
            percent_bp: { type: integer }
        created_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, code, request_id]
      properties:
        type:
          type: string
          description: Relativer Problemtyp unter `/api/v1/problems/`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum: [INVALID_REQUEST, NOT_FOUND, CONFLICT, UNAUTHENTICATED, FORBIDDEN, RATE_LIMITED, BODY_TOO_LARGE, URI_TOO_LONG, METHOD_NOT_ALLOWED, REQUEST_TIMEOUT, SERVICE_UNAVAILABLE, INTERNAL_ERROR, VALIDATION_FAILED, CART_EMPTY, CART_CHANGED, IDEMPOTENCY_KEY_REUSED]
        request_id:
          type: string
          description: Serverseitig erzeugte Kennung aus `X-Request-ID`.
        errors:
          type: array
          description: Nur bei `VALIDATION_FAILED`; nennt Felder und Codes, nie die eingegebenen Werte.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string, example: postal_code }
              code: { type: string, enum: [required, too_short, too_long, invalid_format, unsupported_country] }
        reason:
          type: string
          enum: [total_changed, item_unavailable]
          description: Nur bei `CART_CHANGED`.
        cart:
          $ref: '#/components/schemas/CartSnapshot'
