<figure class="gallery">
  <div class="gallery-stage">
    @if (activeImage(); as image) {
      <img
        class="gallery-image"
        [src]="image.src"
        [alt]="image.alt"
        [width]="image.width"
        [height]="image.height"
        decoding="async"
        (error)="imageFailed(image.src)"
      />
    } @else {
      <app-product-visual class="gallery-placeholder" [seed]="seed()" />
    }
  </div>
  @if (visibleImages().length > 1) {
    <ul class="gallery-thumbs" aria-label="Produktbilder">
      @for (image of visibleImages(); track image.src; let index = $index) {
        <li>
          <button
            class="gallery-thumb"
            type="button"
            [class.is-active]="index === activeIndex()"
            [attr.aria-pressed]="index === activeIndex()"
            [attr.aria-label]="
              'Bild ' + (index + 1) + ' von ' + visibleImages().length + ' anzeigen'
            "
            (click)="select(index)"
          >
            <img
              [src]="image.src"
              alt=""
              [width]="image.width"
              [height]="image.height"
              loading="lazy"
              decoding="async"
              (error)="imageFailed(image.src)"
            />
          </button>
        </li>
      }
    </ul>
  }
  @if (visibleImages().length === 0) {
    <figcaption class="gallery-note">Produktfotos folgen.</figcaption>
  }
</figure>
