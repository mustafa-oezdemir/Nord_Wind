<header class="site-header">
  <div class="container site-header-inner">
    <button
      #menuButton
      class="btn menu-button d-lg-none"
      type="button"
      aria-controls="mobiles-menue"
      aria-haspopup="dialog"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuRequested.emit(menuButton)"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 7h16M4 12h16M4 17h11" />
      </svg>
      <span class="menu-button-label">Menü</span>
    </button>
    <a class="site-header-brand" routerLink="/" aria-label="NordWinds – zur Startseite">
      <app-brand-logo />
    </a>
    <app-search-form class="site-header-search" />
    <a class="btn btn-outline-primary btn-sm site-header-cart" routerLink="/warenkorb">Warenkorb</a>
    <a class="btn btn-outline-primary btn-sm site-header-account" routerLink="/konto">Konto</a>
  </div>
</header>
